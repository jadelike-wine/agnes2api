# agnes2api —— 一键部署。`cp .env.example .env`，填好 .env 里那两把口令，然后 `docker compose up -d`。
services:
  agnes2api:
    # ⚠️ 用 `${IMAGE_TAG:-latest}` 而不是写死版本号：写死的话，服务器上这份 compose
    # 与仓库里的会各自漂移 —— 升级时 `docker compose pull` 全绿、拉的却是旧镜像。
    image: ghcr.io/xwteam/agnes2api:${IMAGE_TAG:-latest}
    container_name: agnes2api
    restart: unless-stopped
    env_file: .env
    ports:
      # 两侧都跟 PORT 走：只改一侧会让「文档说改 PORT 就行」变成假话。
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      # 🔴 **这一行删了或改了路径，下次升级整池 key 静默消失。**
      # `store.json` 是全部状态的唯一落点（上游 key、我们签发的子密钥、面板改过的配置、
      # 用量与事件环）。它跟着 `DATA_DIR` 走，默认 `/app/data`。
      - ./data:/app/data
    healthcheck:
      # 与 Dockerfile 里那条同口径。compose 这一份会覆盖镜像里的，所以两处必须一起改。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:${PORT:-8080}/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
