name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
  workflow_dispatch:

# 同一个 ref 上只留最新那一跑：连推两个提交时，前一跑当场取消。
# 省的不只是 runner 时间——**旧跑的绿会挂在 ref 上**，而它验的是已经被覆盖掉的那棵树。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 显式收窄到只读。不写这一段时，`GITHUB_TOKEN` 拿的是仓库设置里的默认权限
# （公开仓今天多为只读，但那是**仓库设置**，改一次全部 workflow 跟着变，仓里看不见）。
# 这里的门禁一步都不需要写仓库：写死只读之后，被换进来的某个 action 想推提交、开 issue、
# 发 package 时，拿到的 token 一律没有那个权限。
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # ⚠️ **下面这一行（全克隆）是历史凭据扫描的前提，两件事必须一起在场。**
        # 默认的浅克隆里 `git rev-parse --is-shallow-repository` 回 true，而
        # `scripts/scan-secrets.sh` 的历史那一档对浅仓是**按失败处理**的：
        # 删了它历史扫描会 fail closed（**不是静默放行**）——每次 CI 都会红在
        # 「拿不到全部历史」上，而不是悄悄地一个历史对象都不扫。
        # 代价：全克隆要多拉整个 `.git`（本仓今天是几十 MB 量级），可接受。
        with: { fetch-depth: 0 }
      # ── 与语言无关的三道，先跑：它们只读文本、几百毫秒 ────────────────────
      #
      # 📜 这三道是 TypeScript 那一版留下来的，**被测对象与实现语言无关**
      #    （跟踪文件是不是文本 / 那张图里藏没藏东西 / 仓里有没有凭据），
      #    所以它们跟着仓走，没跟着语言走。
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 1/7 跟踪文件不许是二进制
        run: node scripts/check-no-binary.mjs
      # 紧挨着上一步，因为它俩是**同一个决定的两半**：上一步对 docs/logo.png 开了一个
      # 具名放行（模板要求 README 头部块摆这张图），放行让出的那块——「这个文件里藏没藏
      # 东西」——由这一步逐字节接回去。
      #
      # ⚠️ **它的「面板内联副本对账」那一半在 Rust 版上不再适用，如实登记**：
      #    那一半防的是「同一张图在 admin-ui 里另存了一份 base64 副本、两份会漂」，
      #    而 Rust 版的面板**直接引用 `/admin/logo.png` 这个文件**（裁定 P-13，
      #    admin-ui/index.html 里写着），仓里一处内联 base64 PNG 都没有 ⇒
      #    **重复本身没了，不是对账被放宽了**。字节相同这条改由 Rust 判据
      #    `webui::tests::the_panel_logo_is_the_same_file_as_the_docs_logo` 钉着。
      - name: 2/7 具名放行的 PNG 结构审计
        run: node scripts/check-png.mjs --skip-inline
      # 凭据扫描跑两条命令：第一条只扫工作树，第二条是它的**超集**（工作树，再加可达
      # 历史：blob / 提交信息 / 标签说明）。工作树因此被扫两遍，那是有意留着的：红出来
      # 的时候，一眼能分清是工作树回归，还是历史那笔欠账。
      # 历史那一档不是锦上添花——`git push` 发的是历史、不是工作树，一个凭据只要进过
      # 一个提交，哪怕下一个提交就把它删掉，工作树那一档一个字都看不见。
      # ⚠️ **这一档红的时候会把命中的原文逐字打进 Actions 日志，而公开仓的 Actions 日志
      #    是世界可读的**。处置永远是**先把历史里那条命中弄干净再推**，
      #    而不是把这道门禁的输出藏起来。
      - name: 3/7 凭据扫描
        shell: bash
        run: |
          bash scripts/scan-secrets.sh
          bash scripts/scan-secrets.sh --history || {
            rc=$?
            echo "::error::历史档失败。这一档红是新回归：多半是某个新提交的提交信息、或某个已删文件留在历史里的 blob。处置是把那几个提交改掉，不是放宽这道门禁。命中的原文见本步骤 stderr，边界与欠账见 scripts/scan-secrets.sh 文件头"
            exit $rc
          }

      # ── Rust 四道 ──────────────────────────────────────────────────────────
      #
      # ⚠️ 工具链由 `rust-toolchain.toml` 钉死，**这里不写版本号**：
      #    两处都写就会漂，而漂了本地全绿、CI 红在一个没人看得懂的地方。
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - uses: Swatinem/rust-cache@v2
      - name: 4/7 格式
        run: cargo fmt --all -- --check
      # 🔴 `-D warnings`：警告当错误。放宽它等于让「下一个人加的那处」悄悄进来。
      - name: 5/7 clippy（警告当错误）
        run: cargo clippy --all-targets -- -D warnings
      # ⚠️ **不许给它加任何路径过滤器**：过滤掉的那些在 CI 上不会红，
      #    而本仓的判据密度恰恰是它唯一的护栏。
      - name: 6/7 全部判据
        run: cargo test
      - name: 7/7 构建
        run: cargo build --release
