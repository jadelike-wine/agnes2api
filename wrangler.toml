# agnes2api —— Cloudflare Workers 部署配置。
#
# 🔴 **这份文件与 `src/worker.rs` 的绑定名一一对应**：
#    `DB`（D1）/`scheduled`（cron）改了，那边必须同步。
#
# # 首次部署前要做的一次性准备
#
# 1. 建 D1 数据库：
#      npx wrangler d1 create agnes2api-store
#    把输出里的 `database_id` 填到下面 `database_id` 那一行。
#
# 2. 灌两把口令（secrets，不进版本库）：
#      npx wrangler secret put GATEWAY_TOKEN
#      npx wrangler secret put ADMIN_TOKEN
#    🔴 **两把口令不许相同**，且 `ADMIN_TOKEN` 至少 24 位。
#
# 3. 部署：
#      npm install
#      npx wrangler deploy
#
# 自定义域名通过下面的 Custom Domain 配置管理，Cloudflare 自动管理 DNS 和证书。

name = "agnes2api"
workers_dev = true
routes = [
  { pattern = "agnes.api.enovamotion.com", custom_domain = true }
]
# worker-build 0.8.x 的产物入口：`build/index.js` 导出 `default`（WorkerEntrypoint 子类）。
# `build/worker/shim.mjs` 只是向后兼容的重导出，别指它。
main = "build/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers 是 ES module 形态：入口是 worker-build 产出的 JS glue。
# 下面这条 `[build]` 让 `wrangler deploy`/`dev` 先跑 `npm run build`。
[build]
command = "npm run build"

# ── 出站抓取 ────────────────────────────────────────────────────────────────
# `worker::Fetch` 走 Cloudflare 原生 fetch API；`cargo` feature `worker` 已经
# 把 reqwest 排除在 wasm 构建之外，这里不需要任何额外开关。

# ── D1 ─────────────────────────────────────────────────────────────────────
# 持久化的唯一落点：上游 key、对外子密钥、面板配置、事件环、用量桶。
# 🔴 **不用 KV**：它是最终一致，key 池冷却 / 子密钥吊销要的是「写完立刻可见」。
# `src/adapters/storage_d1.rs` 的 `from_env(env)` 读的就是 `DB`。
[[d1_databases]]
binding = "DB"
database_name = "agnes2api-store"
database_id = "056dcf2f-254e-4957-9b23-b4972851f552"

# ── 环境变量（**非**敏感项，敏感项一律走 `wrangler secret`）────────────────
# 🔴 **绝不在这里写 GATEWAY_TOKEN / ADMIN_TOKEN**：vars 会进版本库。
[vars]
# 池与超时旋钮的默认值与 `.env.example` 对齐；改这里不改 secrets。
UPSTREAM_TIMEOUT_MS = "30000"
UPSTREAM_SYNC_TIMEOUT_MS = "60000"
MAX_STRIKES = "3"
COOLDOWN_STRIKE_MS = "300000"
LB_MODE = "priority"
POOL_CACHE_TTL_MS = "30000"
AGNES_BASE_URL = "https://agnes.example.com"   # ⚠️ 换成真实上游
TRUST_PROXY = "false"
USAGE_STATS_ENABLED = "false"

# ── 部署入口 ───────────────────────────────────────────────────────────────
# 顶层 routes 使用 Workers Custom Domain，自动为多层子域名管理 DNS 和证书。
# 普通 Route + 橙云 DNS 不会自动获得覆盖 agnes.api 的 Universal SSL 证书。
# workers_dev = true 保留 https://agnes2api.agnes2api.workers.dev 备用入口。

# ── Cron ───────────────────────────────────────────────────────────────────
# 🔴 **只做 key 池索引对账**，见 `src/worker.rs::scheduled` —— 绝不补池、
# 不跑注册机。30 分钟一轮（D1 免费层查询预算友好；需要更密可自行调）。
[triggers]
crons = ["*/30 * * * *"]

# ── 本地开发 ───────────────────────────────────────────────────────────────
# `npx wrangler dev` 起本地 Miniflare：D1 落到本地 SQLite 文件，
# secrets 从 `.dev.vars` 读（**`.dev.vars` 不进版本库**，见 .gitignore）。
# 本地开发时把 `.env.example` 里那两把口令复制成 `.dev.vars` 即可。
